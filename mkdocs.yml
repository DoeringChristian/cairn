site_name: cairn
site_description: An open-source ML experiment tracker with a local-first, client/server architecture.
repo_url: https://github.com/DoeringChristian/cairn
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle: { icon: material/brightness-4, name: Light mode }

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets: { base_path: ["."], check_paths: true }
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - mkdocs-click

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters: ["!^_"]
            merge_init_into_class: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - guides/index.md
      - Logging metrics: guides/logging.md
      - Media and rich types: guides/media.md
      - Final values and metric rules: guides/metric-rules.md
      - Run lifecycle: guides/runs.md
      - Components and scopes: guides/scopes.md
      - Artifacts and lineage: guides/artifacts.md
      - Sweeps: guides/sweeps.md
      - Integrations: guides/integrations.md
      - Reading data back: guides/reading.md
      - Import and export: guides/import-export.md
      - Server, auth and deployment: guides/server.md
  - Web UI:
      - ui/index.md
      - Runs table: ui/runs-table.md
      - Run page and workspace: ui/workspace.md
      - Cards: ui/cards.md
      - Comparisons: ui/comparisons.md
      - Reports: ui/reports.md
      - Sharing: ui/sharing.md
      - Keyboard shortcuts: ui/shortcuts.md
  - Reference:
      - reference/index.md
      - Python API: reference/python.md
      - CLI: reference/cli.md
      - Expression language: reference/expressions.md
      - Report blocks: reference/report-blocks.md
      - Configuration: reference/configuration.md
  - Examples: examples.md
