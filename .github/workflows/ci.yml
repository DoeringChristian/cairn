name: CI

on:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # cairn-plot ships from the standalone repo, vendored at
          # vendor/cairn-plot; uv's path source needs it checked out.
          submodules: recursive

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Sync dev dependencies
        env:
          CAIRN_SKIP_UI_BUILD: "1"
        run: uv sync --python ${{ matrix.python }} --extra dev

      - name: Run pytest
        run: uv run --python ${{ matrix.python }} pytest -q -m "not torch and not slow"

  ui:
    name: UI typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cairn/ui
    steps:
      - uses: actions/checkout@v4
        with:
          # The app build consumes the cairn-plot renderer source from the
          # vendored submodule (vendor/cairn-plot) via the @cairn-plot alias.
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: cairn/ui/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      # The plot TS→JSON-schema contract and the lib→app import boundary are now
      # enforced in the standalone cairn-plot repo's own CI (the library lives
      # there); the monorepo keeps only the app-card schema drift guard.
      - run: npm run check:card-schema
