name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # cairn-ui ships from its own repo, vendored at vendor/cairn-ui;
          # uv's path source needs it checked out.
          submodules: recursive

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Sync dev dependencies
        run: uv sync --python ${{ matrix.python }} --extra dev

      - name: Run pytest
        run: uv run --python ${{ matrix.python }} pytest -q -m "not torch and not slow"

  packaging:
    name: matching report and browser assets ship in the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      - run: uv build --out-dir dist .
      - name: Verify bundled assets
        run: |
          python - <<'PYCODE'
          import glob, zipfile
          wheel, = glob.glob('dist/cairn_track-*.whl')
          names = set(zipfile.ZipFile(wheel).namelist())
          assert 'cairn/_web/index.html' in names
          assert 'cairn/_web/embed.html' in names
          assert 'cairn/reports/template/report.css' in names
          assert any(n.startswith('cairn/_web/assets/') for n in names)
          assert not any(n.endswith(('.tsx', '.ts')) for n in names)
          PYCODE
      - name: Install without a Node runtime or notebook extra
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/cairn_track-*.whl
          cd /tmp
          /tmp/clean/bin/cairn --help
          /tmp/clean/bin/python - <<'PYCODE'
          import asyncio, tempfile
          from pathlib import Path
          import httpx
          from cairn import viewer
          from cairn.server.app import create_app
          assert viewer.is_available()
          async def smoke():
              with tempfile.TemporaryDirectory() as repo:
                  app = create_app(data_dir=Path(repo), mount_ui=True, auth_enabled=False)
                  async with app.router.lifespan_context(app):
                      assert app.state.notebooks is None
                      async with httpx.AsyncClient(transport=httpx.ASGITransport(app=app),
                                                   base_url='http://wheel.test') as client:
                          assert (await client.get('/')).status_code == 200
                          assert (await client.get('/api/health')).status_code == 200
                          assert (await client.get('/api/reports')).status_code == 200
                          response = await client.post('/api/report-workspaces/missing/build',
                                                       json={'expected_revision': 1})
                          assert response.status_code == 503
                          assert 'cairn-track[reports]' in response.json()['detail']
          asyncio.run(smoke())
          PYCODE

  deployed-storage:
    name: PostgreSQL and S3 storage contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: cairn-ci
          POSTGRES_DB: cairn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cairn -d cairn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CAIRN_TEST_DATABASE_URL: postgresql://cairn:cairn-ci@127.0.0.1:5432/cairn_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12 --extra dev --extra deployment
      - name: Test migrations, transactions and report execution with deployed storage
        run: uv run --no-sync pytest -q tests/integration/test_postgres.py tests/unit/test_s3_blobs.py
