name: CI

on:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # cairn-plot ships from the standalone repo, vendored at
          # vendor/cairn-plot; uv's path source needs it checked out.
          submodules: recursive

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Sync dev dependencies
        run: uv sync --python ${{ matrix.python }} --extra dev

      - name: Run pytest
        run: uv run --python ${{ matrix.python }} pytest -q -m "not torch and not slow"

  packaging:
    name: the cairn-track wheel carries no UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      - run: uv build --wheel --out-dir dist .
      # cairn-ui is built and released from its own repository; here it is a
      # submodule, built only so the install checks below have a wheel to use.
      - run: uv build --wheel --out-dir dist vendor/cairn-ui

      - name: cairn-track ships no UI
        run: |
          python - <<'PY'
          import glob, os, zipfile
          wheel, = glob.glob("dist/cairn_track-*.whl")
          names = zipfile.ZipFile(wheel).namelist()
          strays = [
              n for n in names
              if n.endswith((".html", ".tsx", ".ts", ".css", ".mjs", ".map", ".woff2"))
              or "/assets/" in n
          ]
          assert not strays, strays
          size = os.path.getsize(wheel)
          assert size < 2_000_000, f"{size} bytes: the UI is creeping back in"
          print(f"cairn-track: {size/1e6:.2f} MB, {len(names)} entries, no UI")
          PY

      - name: cairn-ui ships the bundle
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel, = glob.glob("dist/cairn_ui-*.whl")
          names = set(zipfile.ZipFile(wheel).namelist())
          for shell in ("index.html", "embed.html", "plot.html"):
              assert f"cairn_ui/_dist/{shell}" in names, shell
          assert any(n.startswith("cairn_ui/_dist/assets/") for n in names)
          PY

      - name: cairn-track installs and runs with no Node and no viewer
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet dist/cairn_track-*.whl
          /tmp/clean/bin/cairn --help > /dev/null
          cd /tmp   # keep the repo off sys.path so this tests the INSTALL
          /tmp/clean/bin/python -c "
          from cairn.server.app import create_app
          from cairn import viewer
          assert not viewer.is_available()
          create_app()
          "
          if /tmp/clean/bin/cairn ui --repo /tmp/r 2>/tmp/err; then
            echo "cairn ui should have failed without the viewer"; exit 1
          fi
          grep -q "cairn-track\[ui\]" /tmp/err

      - name: and works once the viewer is installed
        run: |
          /tmp/clean/bin/pip install --quiet dist/cairn_ui-*.whl
          cd /tmp
          /tmp/clean/bin/python -c "
          from cairn import viewer
          assert viewer.is_available(), 'viewer wheel did not register'
          "

      # Everything above installs the two wheels BY PATH, which proves they work
      # together but never asks pip to resolve the extra. That is the hole the
      # `[ui]` extra fell through: it named version ranges for three packages
      # that are on no index, so `pip install 'cairn-track[ui]'` 404'd before it
      # reached a wheel. This step is the only one that exercises the git pins.
      - name: the [ui] extra resolves from a bare wheel
        run: |
          python -m venv /tmp/extra
          /tmp/extra/bin/pip install --quiet "$(echo dist/cairn_track-*.whl)[ui]"
          cd /tmp   # keep the repo off sys.path so this tests the INSTALL
          /tmp/extra/bin/python -c "
          import cairn_plot, cairn_ui
          from cairn import viewer
          import cairn
          assert viewer.is_available()
          cairn.ui; cairn.plot
          "

      - name: the [plot] extra resolves and pulls no viewer
        run: |
          python -m venv /tmp/plotonly
          /tmp/plotonly/bin/pip install --quiet "$(echo dist/cairn_track-*.whl)[plot]"
          cd /tmp
          /tmp/plotonly/bin/python -c "
          import cairn, importlib.util
          cairn.plot
          assert importlib.util.find_spec('cairn_ui') is None, '[plot] dragged the viewer in'
          "
