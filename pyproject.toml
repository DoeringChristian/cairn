[project]
name = "cairn-track"
version = "0.2.0"
description = "An open-source ML experiment tracker with a client/server architecture for easy cross-device use on a local network."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Cairn contributors" }]
keywords = ["machine-learning", "experiment-tracking", "mlops", "sqlite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "zstandard>=0.22.0",
    "pillow>=10.0.0",
    "numpy>=1.24",
    "openexr>=3.3",
    "click>=8.1.0",
    "platformdirs>=4.0",
    "psutil>=5.9",
    "pynvml>=11.5.0",
    "python-multipart>=0.0.9",
    "tomli-w>=1.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
# The browser viewer. `cairn-track` itself ships no UI assets: tracking, the
# CLI and the HTTP API all work without this. Pinned exactly and bumped in
# lock-step — the bundle encodes the /api/* response shapes and the card-spec
# schema this server produces, so skew is a bug, not a compatibility window.
# Two halves, gated separately like ray[tune] / ray[serve].
#
#   [plot] unlocks `cairn.plot` — the renderer surface.
#   [ui]   unlocks `cairn.ui` (cards, embeds, the notebook report container)
#          AND the browser viewer itself.
#
# [ui] implies [plot]: the card surface subclasses cairn-plot's Element and
# builds on its spec models, so a viewer install without a renderer cannot work.
plot = ["cairn-plot>=0.1,<0.2"]
ui = ["cairn-track[plot]", "cairn-ui==0.2.0"]
media = [
    "matplotlib>=3.7",
    "plotly>=5.18",
    "kaleido>=0.2.1",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.4.9",
    "soundfile>=0.12",
]
hf = [
    "transformers>=4.40",
    "datasets>=2.18",
]
discovery = [
    "zeroconf>=0.132",
]
examples = [
    "marimo>=0.10",
]
dev = [
    # The viewer half, so a dev checkout can exercise everything the `ui`
    # extra unlocks.
    "cairn-ui",
    "cairn-plot",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "pytest-timeout>=2.3",
    "respx>=0.21",
    "freezegun>=1.4",
    "matplotlib>=3.7",
    "plotly>=5.18",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.4.9",
    "soundfile>=0.12",
    "zeroconf>=0.132",
    "transformers>=4.40",
]

[project.scripts]
cairn = "cairn.cli:main"

[project.urls]
Repository = "https://github.com/anthropics/cairn"

# cairn-plot lives in a standalone repository
# (github.com/doeringchristian/cairn-plot), consumed here as a git submodule at
# `vendor/cairn-plot` (pinned commit). It is a dependency of the `ui` extra, not
# of cairn-track itself; in dev it resolves editable from that checkout.
[tool.uv.sources]
cairn-plot = { path = "vendor/cairn-plot", editable = true }
cairn-ui = { path = "vendor/cairn-ui", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `packages = ["cairn"]` ships EVERYTHING under cairn/ that is not ignored, not
# just the .py files — which is how 87 .ts and 79 .tsx files used to ride along
# beside the bundle. The viewer now lives in vendor/cairn-ui, so cairn/ holds
# Python and nothing else; tests/unit/test_package_boundaries.py keeps it that
# way. No build hook: there is nothing here to build.
[tool.hatch.build.targets.wheel]
packages = ["cairn"]

[tool.hatch.build.targets.sdist]
# The viewer is its own sdist (vendor/cairn-ui); nothing is excluded here
# because nothing UI-shaped is under cairn/ any more.
include = [
    "cairn/",
    "tests/",
    "examples/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    "CAIRN_SPEC.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "torch: tests that require torch",
    "media: tests that require media extras (matplotlib/plotly/imageio/soundfile)",
    "network: tests that use real network sockets",
    "slow: slow tests (perf benchmarks)",
]
filterwarnings = [
    "ignore::DeprecationWarning:pynvml",
]

[tool.coverage.run]
source = ["cairn"]
omit = [
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
