[project]
name = "cairn-track"
version = "0.2.0"
description = "An open-source ML experiment tracker with a client/server architecture for easy cross-device use on a local network."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Cairn contributors" }]
keywords = ["machine-learning", "experiment-tracking", "mlops", "sqlite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "zstandard>=0.22.0",
    "pillow>=10.0.0",
    "numpy>=1.24",
    "openexr>=3.3",
    "click>=8.1.0",
    "platformdirs>=4.0",
    "psutil>=5.9",
    "pynvml>=11.5.0",
    "python-multipart>=0.0.9",
    "tomli-w>=1.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The optional halves, gated separately.
#
#   [plot] unlocks `cairn.plot` — cairn-plot, for notebooks and standalone
#          HTML reports.
#   [ui]   unlocks `cairn.ui` (cards and notebook embeds) AND the browser
#          viewer itself. The viewer draws with its own libraries; it does
#          not need cairn-plot.
#
# Both are pinned to a git commit rather than a version range, because neither
# is on PyPI (nor is cairn-track). A range would send pip to an index that
# answers 404, so `pip install 'cairn-track[ui]'` would fail at resolution
# before it ever got to the wheels. The viewer pin is lock-step with this
# server — the bundle encodes the /api/* response shapes and the card-spec
# schema — so bump it together with vendor/cairn-ui; test_package_boundaries.py
# enforces that they agree. Swap both back to version ranges the day the
# packages are published.
plot = [
    "cairn-plot @ git+https://github.com/doeringchristian/cairn-plot@1f37f37b7a747f77f17f02a9d328b2c23d830845",
]
ui = [
    "cairn-ui @ git+https://github.com/DoeringChristian/cairn-ui@e7a57fe60be8ae5bbfa5b2af50c807e384c77b48",
]
media = [
    "matplotlib>=3.7",
    "plotly>=5.18",
    "kaleido>=0.2.1",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.4.9",
    "soundfile>=0.12",
]
hf = [
    "transformers>=4.40",
    "datasets>=2.18",
]
discovery = [
    "zeroconf>=0.132",
]
examples = [
    "marimo>=0.10",
]
export = [
    "pandas>=2.0",
    "pyarrow>=14.0",
]
# Framework integrations (cairn.integrations.*) and `cairn import-tb`.
tb = [
    "tensorboard>=2.14",
]
lightning = [
    "lightning>=2.0",
]
keras = [
    "keras>=3.0",
]
xgboost = [
    "xgboost>=2.0",
]
# Bayesian search for sweeps (method: bayes); grid and random need nothing.
sweep = [
    "optuna>=3.5",
]
dev = [
    # Both optional halves (and the export deps), so a dev checkout can
    # exercise everything they unlock. Via the extras, so the git pins live in exactly one place;
    # [tool.uv.sources] below redirects both to the local checkouts anyway.
    "cairn-track[ui,plot,export]",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "pytest-timeout>=2.3",
    "respx>=0.21",
    "freezegun>=1.4",
    "matplotlib>=3.7",
    "plotly>=5.18",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.4.9",
    "soundfile>=0.12",
    "zeroconf>=0.132",
    "transformers>=4.40",
    "torch>=2.0",
]

[project.scripts]
cairn = "cairn.cli:main"

[project.urls]
Repository = "https://github.com/anthropics/cairn"

# cairn-plot lives in a standalone repository
# (github.com/doeringchristian/cairn-plot), consumed here as a git submodule at
# `vendor/cairn-plot` (pinned commit). It backs the `plot` extra only (neither
# cairn-track itself nor the viewer needs it); in dev it resolves editable from
# that checkout.
[tool.uv.sources]
cairn-plot = { path = "vendor/cairn-plot", editable = true }
cairn-ui = { path = "vendor/cairn-ui", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Required for the `@ git+...` pins in [plot] and [ui]. Hatchling refuses direct
# references by default because PyPI rejects any distribution carrying one —
# the right guard, and the thing to undo when these packages get published.
[tool.hatch.metadata]
allow-direct-references = true

# `packages = ["cairn"]` ships EVERYTHING under cairn/ that is not ignored, not
# just the .py files — which is how 87 .ts and 79 .tsx files used to ride along
# beside the bundle. The viewer now lives in vendor/cairn-ui, so cairn/ holds
# Python and nothing else; tests/unit/test_package_boundaries.py keeps it that
# way. No build hook: there is nothing here to build.
[tool.hatch.build.targets.wheel]
packages = ["cairn"]

[tool.hatch.build.targets.sdist]
# The viewer is its own sdist (vendor/cairn-ui); nothing is excluded here
# because nothing UI-shaped is under cairn/ any more.
include = [
    "cairn/",
    "tests/",
    "examples/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    "CAIRN_SPEC.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "torch: tests that require torch",
    "media: tests that require media extras (matplotlib/plotly/imageio/soundfile)",
    "network: tests that use real network sockets",
    "slow: slow tests (perf benchmarks)",
]
filterwarnings = [
    "ignore::DeprecationWarning:pynvml",
]

[tool.coverage.run]
source = ["cairn"]
omit = [
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
