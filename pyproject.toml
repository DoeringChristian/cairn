[project]
name = "cairn-track"
version = "0.7.0"
description = "Experiment tracking and executable research reports, with direct local storage or a remote server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Cairn contributors" }]
keywords = ["machine-learning", "experiment-tracking", "mlops", "sqlite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.135.3",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "zstandard>=0.22.0",
    "pillow>=10.0.0",
    "numpy>=1.24",
    "openexr>=3.3",
    "click>=8.1.0",
    "platformdirs>=4.0",
    "psutil>=5.9",
    "nvidia-ml-py>=12.535.77",  # provides `import pynvml` (the `pynvml` package is a deprecated wrapper)
    "python-multipart>=0.0.9",
    "tomli-w>=1.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
deployment = ["sqlalchemy>=2.0", "psycopg[binary]>=3.2", "boto3>=1.35"]
reports = [
    "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6.29", "packaging>=24",
    "matplotlib>=3.7", "plotly>=5.18", "markdown-it-py>=3",
    "mdit-py-plugins>=0.4", "latex2mathml>=3",
]

# The optional half.
#
#   [ui]   unlocks `cairn.ui` (cards and notebook embeds). The browser
#          bundle itself is included in the base package.
#
# Pinned to a git commit rather than a version range, because cairn-ui is not
# on PyPI (nor is cairn-track). A range would send pip to an index that
# answers 404, so `pip install 'cairn-track[ui]'` would fail at resolution
# before it ever got to the wheels. The pin is lock-step with this server —
# the bundle encodes the /api/* response shapes and the card-spec schema — so
# bump it together with vendor/cairn-ui; test_package_boundaries.py enforces
# that they agree. Swap it back to a version range the day the package is
# published.
ui = [
    "cairn-ui @ git+https://github.com/DoeringChristian/cairn-ui@736200ea5e4e5b09c2c1832b73946d5ebc8ffdc8",
]
media = [
    "matplotlib>=3.7",
    "plotly>=5.18",
    "kaleido>=0.2.1",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.4.9",
    "soundfile>=0.12",
]
discovery = [
    "zeroconf>=0.132",
]
export = [
    "pandas>=2.0",
    "pyarrow>=14.0",
]
# Framework integrations and the Python TensorBoard importer.
tb = [
    "tensorboard>=2.14",
]
# The HuggingFace Trainer callback. Brings transformers only: the model
# backend (torch, usually) is the user's choice.
huggingface = [
    "transformers>=4.40",
]
lightning = [
    "lightning>=2.0",
]
keras = [
    "keras>=3.0",
]
xgboost = [
    "xgboost>=2.0",
]
ultralytics = [
    "ultralytics>=8.0",
]
# Bayesian search for sweeps (method: bayes); grid and random need nothing.
sweep = [
    "optuna>=3.5",
]
# The documentation site (`mkdocs serve`, `mkdocs build`).
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-click>=0.8",
]
dev = [
    # The viewer (and the export deps), so a dev checkout can exercise
    # everything they unlock. Via the extra, so the git pin lives in exactly
    # one place; [tool.uv.sources] below redirects it to the local checkout.
    "cairn-track[reports,ui,export,docs]",
    "pytest>=8.0",
    "moto[s3]>=5.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "pytest-timeout>=2.3",
    "respx>=0.21",
    "freezegun>=1.4",
    "matplotlib>=3.7",
    "plotly>=5.18",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.4.9",
    "soundfile>=0.12",
    "zeroconf>=0.132",
    "transformers>=4.40",
    "torch>=2.0",
]

[project.scripts]
cairn = "cairn.cli:main"

[project.urls]
Repository = "https://github.com/DoeringChristian/cairn"

# cairn-ui lives in its own repository, consumed here as a git submodule at
# `vendor/cairn-ui` (pinned commit); in dev it resolves editable from that
# checkout.
[tool.uv.sources]
cairn-ui = { path = "vendor/cairn-ui", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Required for the `@ git+...` pin in [ui]. Hatchling refuses direct
# references by default because PyPI rejects any distribution carrying one —
# the right guard, and the thing to undo when these packages get published.
[tool.hatch.metadata]
allow-direct-references = true

# Python and report templates live in cairn/. The matching prebuilt browser
# runtime is added below through force-include; browser sources stay vendored.
[tool.hatch.build.targets.wheel]
packages = ["cairn"]

[tool.hatch.build.targets.sdist]
# The viewer is its own sdist (vendor/cairn-ui). Patterns use gitignore
# semantics, so each one is anchored at the root with a leading "/": an
# unanchored "tests/" or "examples/" also matches any such directory deeper
# down — vendor/cairn-ui/node_modules is full of them.
include = [
    "/cairn",
    "/tests",
    "/examples",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "torch: tests that require torch",
    "media: tests that require media extras (matplotlib/plotly/imageio/soundfile)",
    "network: tests that use real network sockets",
    "slow: slow tests (perf benchmarks)",
    "real_daemons: local repos are served by real daemon subprocesses, not in-process test servers",
]
filterwarnings = [
    "ignore::DeprecationWarning:pynvml",
]

[tool.coverage.run]
source = ["cairn"]
omit = [
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

# The viewer shipped with this tracker is built from the matching source checkout.
[tool.hatch.build.targets.wheel.force-include]
"vendor/cairn-ui/cairn_ui/_dist" = "cairn/_web"

[tool.hatch.build.targets.sdist.force-include]
"vendor/cairn-ui/cairn_ui/_dist" = "vendor/cairn-ui/cairn_ui/_dist"
